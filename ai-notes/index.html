<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Notes — A Handwritten Book by Amit Mahata</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <meta name="description"
    content="A handwritten-style AI book organised into chapters and topics. Chapter 1, Inside the Mind of AI: the Evolution of AI (Turing Test to autonomous agents) and Does ChatGPT Know or Guess? (search vs LLMs, next-word prediction, hallucinations, tools and RAG)." />

  <!-- Handwritten & Code Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Fira+Code:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <script>
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  
  <link rel="stylesheet" href="../sketch-kit.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../shared-search.css" />
</head>

<body>

  <div class="app">

    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="nav-btn drawer-toggle-btn" onclick="toggleSidebar(!document.getElementById('sidebarDrawer').classList.contains('open'))" aria-expanded="false" title="Chapters, topics &amp; notebook switcher (T)" aria-label="Chapters">☰<span class="btn-label"> Chapters</span></button>
        <button class="nav-btn contents-btn" onclick="goToContents()" title="Book contents (C)" aria-label="Book contents">📖<span class="btn-label"> Contents</span></button>
        <a href="../index.html" class="home-link-btn" title="Back to All Notes Hub" aria-label="Notes Hub">🏠<span class="btn-label"> Hub</span></a>
        <span class="brand-icon">🧠</span>
        <span class="topbar-title"><span id="topbarTitleText">AI Notes</span> <span class="author-pill" id="topbarBreadcrumb">by Amit Mahata • Handwritten Book</span></span>
      </div>
      <div class="topbar-center">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" title="Previous Page" aria-label="Previous page">←<span class="btn-label"> Prev</span></button>
        <span class="page-indicator" id="pageIndicator">Contents</span>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)" title="Next Page" aria-label="Next page"><span class="btn-label">Next </span>→</button>
      </div>
      <div class="topbar-right">
        <button class="topbar-search-btn" onclick="openSearchModal()" title="Search All Notes (Ctrl+K)" aria-label="Search all notes">
          <span>🔍<span class="btn-label"> Search</span></span>
          <span class="kbd-hint">Ctrl+K</span>
        </button>
      </div>
    </header>

    <!-- Topic Sidenav Drawer -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar-drawer" id="sidebarDrawer" aria-label="Topic Sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <a href="../index.html" class="sidebar-home-link" title="Return to Main Hub">
            <span class="home-icon">🏠</span>
            <span class="brand-text">Notes Hub</span>
          </a>
        </div>
        <button class="sidebar-close-btn" onclick="toggleSidebar(false)" title="Close panel (T)" aria-label="Close Sidebar">&times;</button>
      </div>

      <!-- Notebook Quick Switcher -->
      <div class="sidebar-section">
        <div class="section-label">SWITCH NOTEBOOK</div>
        <nav class="notebook-switcher-grid">
          <a href="../ai-notes/index.html" class="switcher-card active" title="AI Notes">
            <span class="switcher-icon">🧠</span>
            <div class="switcher-info">
              <span class="switcher-title">AI Notes</span>
              <span class="switcher-pages">Book • 15 Pages</span>
            </div>
          </a>
          <a href="../system-design-notes/index.html" class="switcher-card" title="System Design Notes">
            <span class="switcher-icon">📐</span>
            <div class="switcher-info">
              <span class="switcher-title">System Design</span>
              <span class="switcher-pages">10 Pages</span>
            </div>
          </a>
          <a href="../kubernetes-notes/index.html" class="switcher-card" title="Kubernetes Notes">
            <span class="switcher-icon">⎈</span>
            <div class="switcher-info">
              <span class="switcher-title">Kubernetes</span>
              <span class="switcher-pages">6 Pages</span>
            </div>
          </a>
          <a href="../docker-notes/index.html" class="switcher-card" title="Docker Notes">
            <span class="switcher-icon">🐳</span>
            <div class="switcher-info">
              <span class="switcher-title">Docker</span>
              <span class="switcher-pages">6 Pages</span>
            </div>
          </a>
          <a href="../dsa-notes/index.html" class="switcher-card" title="DSA Notes">
            <span class="switcher-icon">💻</span>
            <div class="switcher-info">
              <span class="switcher-title">DSA Master</span>
              <span class="switcher-pages">14 Pages</span>
            </div>
          </a>
          <a href="../interview-notes/index.html" class="switcher-card" title="Interview Q&amp;A Notes">
            <span class="switcher-icon">🎯</span>
            <div class="switcher-info">
              <span class="switcher-title">Interview Q&amp;A</span>
              <span class="switcher-pages">25 Pages</span>
            </div>
          </a>
        </nav>
      </div>

      <!-- Search Filter -->
      <div class="sidebar-section">
        <div class="section-label">BOOK CONTENTS (PRESS 'T')</div>
        <div class="sidebar-search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="topicSearchInput" placeholder="Search chapters &amp; topics (e.g. Turing, CNN, LLM)..." oninput="filterSidebarTopics(this.value)" autocomplete="off" />
          <button class="clear-search-btn" id="clearSearchBtn" onclick="clearTopicSearch()" style="display:none;">&times;</button>
        </div>
      </div>

      <!-- Chapter → Topic → Page tree (built by script.js from the <main> markup) -->
      <div class="sidebar-topics-list" id="sidebarTopicsList"></div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-action-btn home-btn">
          <span>🏠 Return to All Notebooks Hub</span>
        </a>
      </div>
    </aside>

    <!-- Dot Navigation -->
    <div class="dot-nav" id="dotNav"></div>

    <!-- Notebook Pages Container
      The book's content is NOT written here. It is assembled by script.js from:
        book.js            → chapters & topics (titles, icons, order, file paths)
        chapters/**/*.js   → each topic's pages (<article class="notebook-page">)
      See README.md in this folder for how to add a page, topic or chapter.
    -->
    <main class="notebook-container" id="notebookContainer">
      <noscript><p class="book-load-error">This handwritten book needs JavaScript to assemble its chapters.</p></noscript>
    </main>

  </div>

  <script src="book.js"></script>
  <script src="script.js"></script>
  <script src="../shared-search.js"></script>
</body>

</html>
